workflows:
  ios-appstore-workflow:
    name: TrimPlay iOS App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Apple Connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.trimplay
      xcode: latest
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          PROJECT_FILE=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -project "$PROJECT_FILE" | awk '/Schemes:/{getline; print; exit}' | xargs)
          xcode-project build-ipa \
            --project "$PROJECT_FILE" \
            --scheme "$SCHEME_NAME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
