Bitte aktualisiere in der Datei codemagic.yaml im Bereich android-release den Schritt "Configure Android signing" und "Build Android AAB" exakt so:

      - name: Configure Android signing
        script: |
          cat << 'EOF' >> android/gradle.properties
          RELEASE_STORE_FILE=$CM_KEYSTORE_PATH
          RELEASE_STORE_PASSWORD=$CM_KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=$CM_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$CM_KEY_PASSWORD
          EOF
          python3 -c '
          with open("android/app/build.gradle", "r") as f:
              content = f.read()
          signing_block = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
          """
          content = content.replace("buildTypes {", signing_block + "\n    buildTypes {")
          content = content.replace("minifyEnabled false", "minifyEnabled false\n            signingConfig signingConfigs.release")
          with open("android/app/build.gradle", "w") as f:
              f.write(content)
          '
      - name: Build Android AAB
        script: |
          cd android
          ./gradlew bundleRelease
          ls -la app/build/outputs/bundle/release/
