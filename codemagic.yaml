android-release:
    name: TrimPlay Android Google Play Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - trimplay_keystore
      java: 21
      node: latest
    scripts:
      - name: Install dependencies and generate Android project
        script: |
          npm install
          npm install @capacitor/android
          npm run build
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx capacitor-assets generate --android || true
          npx cap sync android
      - name: Increment versionCode
        script: |
          sed -i "s/versionCode 1/versionCode 10/" android/app/build.gradle || true
      - name: Configure Android signing
        script: |
          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
      - name: Build Android AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
