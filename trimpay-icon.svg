<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6EF"/>
      <stop offset="0.55" stop-color="#FFE3D3"/>
      <stop offset="1" stop-color="#FBD3C2"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2836F"/>
      <stop offset="1" stop-color="#C75B66"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D06A6B"/>
      <stop offset="1" stop-color="#B44F5C"/>
    </linearGradient>
  </defs>

  <!-- rounded app-tile background, warm pastel -->
  <rect x="0" y="0" width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- timer ring: soft track + progress arc -->
  <circle cx="244" cy="236" r="126" fill="none" stroke="#F0B7A6" stroke-width="20" opacity="0.85"/>
  <circle cx="244" cy="236" r="126" fill="none" stroke="url(#ring)" stroke-width="20"
          stroke-linecap="round" stroke-dasharray="560 792" transform="rotate(-104 244 236)"/>
  <!-- ring start dot -->
  <circle cx="244" cy="98" r="17" fill="#C75B66"/>

  <!-- play triangle -->
  <path d="M 212 178
           L 212 294
           Q 212 304 221 299
           L 316 245
           Q 325 240 316 235
           L 221 173
           Q 212 168 212 178 Z"
        fill="url(#play)" stroke="url(#play)" stroke-width="10" stroke-linejoin="round"/>

  <!-- scissors, sage, trimming at lower right -->
  <g stroke="#7FA284" stroke-width="15" stroke-linecap="round" fill="none">
    <!-- blade 1 -->
    <path d="M 391 342 L 452 296"/>
    <!-- blade 2 -->
    <path d="M 391 342 L 330 296"/>
    <!-- handle 1 -->
    <path d="M 391 342 L 438 402"/>
    <!-- handle 2 -->
    <path d="M 391 342 L 344 402"/>
    <circle cx="444" cy="416" r="21" stroke-width="13"/>
    <circle cx="338" cy="416" r="21" stroke-width="13"/>
  </g>
  <!-- pivot -->
  <circle cx="391" cy="342" r="11" fill="#5F7F64"/>
</svg>
